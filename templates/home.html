<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Student Exam Performance Predictor</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0f172a;
            overflow-x: hidden;
        }

        /* Background Glow */

        body::before,
        body::after{
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
        }

        body::before{
            width: 300px;
            height: 300px;
            background: #3b82f6;
            top: -100px;
            left: -100px;
        }

        body::after{
            width: 350px;
            height: 350px;
            background: #06b6d4;
            bottom: -120px;
            right: -120px;
        }

        .login{
            position: relative;
            z-index: 1;

            width: 100%;
            max-width: 750px;

            padding: 40px;

            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);

            backdrop-filter: blur(14px);

            border-radius: 24px;

            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .login h1{
            text-align: center;
            color: white;
            font-size: 34px;
            margin-bottom: 25px;
        }

        legend{
            width: 100%;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        .mb-3{
            margin-bottom: 20px;
        }

        .form-label{
            display: block;
            margin-bottom: 8px;
            color: white;
            font-weight: 500;
            font-size: 15px;
        }

        .form-control{
            width: 100%;
            padding: 14px 15px;

            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;

            background: rgba(255,255,255,0.08);
            color: white;

            font-size: 15px;

            outline: none;
            transition: 0.3s ease;
        }

        .form-control::placeholder{
            color: #cbd5e1;
        }

        .form-control:focus{
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56,189,248,0.4);
        }

        select option{
            color: black;
        }

        .btn{
            width: 100%;
            padding: 15px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(135deg, #3b82f6, #06b6d4);

            color: white;
            font-size: 17px;
            font-weight: 600;

            cursor: pointer;
            transition: all 0.3s ease;

            box-shadow: 0 5px 20px rgba(59,130,246,0.4);
        }

        .btn:hover{
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(6,182,212,0.5);
        }

        h2{
            margin-top: 25px;
            text-align: center;

            background: rgba(255,255,255,0.08);

            padding: 16px;
            border-radius: 12px;

            color: white;
            font-size: 22px;
            font-weight: 600;
        }

        @media(max-width: 768px){

            .login{
                padding: 25px;
            }

            .login h1{
                font-size: 28px;
            }

            legend{
                font-size: 20px;
            }

            h2{
                font-size: 18px;
            }
        }

    </style>
</head>

<body>

    <div class="login">


        <form action="{{ url_for('predict_datapoint')}}" method="post">

            <legend>Student Exam Performance Prediction</legend>

            <div class="mb-3">
                <label class="form-label">Gender</label>

                <select class="form-control" name="gender" required>
                    <option selected disabled value="">Select your Gender</option>

                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Race or Ethnicity</label>

                <select class="form-control" name="ethnicity" required>
                    <option selected disabled value="">Select Ethnicity</option>

                    <option value="group A">Group A</option>
                    <option value="group B">Group B</option>
                    <option value="group C">Group C</option>
                    <option value="group D">Group D</option>
                    <option value="group E">Group E</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Parental Level of Education</label>

                <select class="form-control" name="parental_level_of_education" required>
                    <option selected disabled value="">Select Parent Education</option>

                    <option value="associate's degree">Associate's degree</option>
                    <option value="bachelor's degree">Bachelor's degree</option>
                    <option value="high school">High school</option>
                    <option value="master's degree">Master's degree</option>
                    <option value="some college">Some college</option>
                    <option value="some high school">Some high school</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Lunch Type</label>

                <select class="form-control" name="lunch" required>
                    <option selected disabled value="">Select Lunch Type</option>

                    <option value="free/reduced">Free/Reduced</option>
                    <option value="standard">Standard</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Test Preparation Course</label>

                <select class="form-control" name="test_preparation_course" required>
                    <option selected disabled value="">Select Test Course</option>

                    <option value="none">None</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Reading Score out of 100</label>

                <input 
                    class="form-control" 
                    type="number" 
                    name="reading_score"
                    placeholder="Enter your Reading score"
                    min="0" 
                    max="100" 
                    required
                />
            </div>

            <div class="mb-3">
                <label class="form-label">Writing Score out of 100</label>

                <input 
                    class="form-control" 
                    type="number" 
                    name="writing_score"
                    placeholder="Enter your Writing score"
                    min="0" 
                    max="100" 
                    required
                />
            </div>

            <div class="mb-3">
                <input 
                    class="btn" 
                    type="submit" 
                    value="Predict Maths Score"
                />
            </div>

        </form>

    </div>

</body>
</html>
