<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Predictor</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            overflow: hidden;
        }

        /* Background circles */
        body::before,
        body::after{
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
        }

        body::before{
            width: 300px;
            height: 300px;
            background: #3b82f6;
            top: -80px;
            left: -80px;
        }

        body::after{
            width: 350px;
            height: 350px;
            background: #06b6d4;
            bottom: -100px;
            right: -100px;
        }

        .container{
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 650px;
            padding: 60px 40px;
            text-align: center;

            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(14px);

            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        h1{
            color: white;
            font-size: 42px;
            line-height: 1.4;
            margin-bottom: 18px;
            font-weight: 700;
        }

        p{
            color: #cbd5e1;
            font-size: 18px;
            margin-bottom: 35px;
        }

        .btn{
            padding: 15px 40px;
            border: none;
            border-radius: 50px;

            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            color: white;

            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;

            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(59,130,246,0.4);
        }

        .btn:hover{
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 30px rgba(6,182,212,0.5);
        }

        a{
            text-decoration: none;
        }

        @media(max-width: 768px){

            .container{
                padding: 40px 25px;
            }

            h1{
                font-size: 30px;
            }

            p{
                font-size: 16px;
            }

            .btn{
                width: 100%;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Student Performance Predictor</h1>

        <p>
            Predict student maths scores using machine learning insights.
        </p>

        <a href="/predictdata">
            <button class="btn" type="button">
                Get Started
            </button>
        </a>

    </div>

</body>
</html>
