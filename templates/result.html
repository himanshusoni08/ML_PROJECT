<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: #0f172a;
            overflow: hidden;
        }

        body::before,
        body::after{
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
        }

        body::before{
            width: 300px;
            height: 300px;
            background: #3b82f6;
            top: -100px;
            left: -100px;
        }

        body::after{
            width: 350px;
            height: 350px;
            background: #06b6d4;
            bottom: -100px;
            right: -100px;
        }

        .result-box{
            position: relative;
            z-index: 1;

            width: 90%;
            max-width: 500px;

            padding: 50px 35px;
            text-align: center;

            border-radius: 24px;

            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);

            backdrop-filter: blur(14px);

            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        h1{
            color: white;
            margin-bottom: 20px;
            font-size: 34px;
        }

        .score{
            font-size: 70px;
            font-weight: bold;
            color: #38bdf8;
            margin: 25px 0;
        }

        p{
            color: #cbd5e1;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn{
            padding: 14px 35px;

            border: none;
            border-radius: 50px;

            background: linear-gradient(135deg, #3b82f6, #06b6d4);

            color: white;
            font-size: 16px;
            font-weight: 600;

            cursor: pointer;
            transition: 0.3s ease;
        }

        .btn:hover{
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(6,182,212,0.4);
        }

        a{
            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="result-box">

        <h1>Prediction Result</h1>

        <p>Your predicted Maths Score is</p>

        <div class="score">
            {{ results }}
        </div>

        <a href="/">
            <button class="btn">
                Back To Home
            </button>
        </a>

    </div>

</body>
</html>
